# CI 质量门（site 时代）：push/PR 即跑 site 构建 + 检查矩阵 + 几何快照回归。
# geom 用 runner 预装的 Google Chrome（playwright channel:'chrome' 自动找到 /usr/bin/google-chrome）。
# accept:poc5 需 8092 编辑服在线（它不自起），先于本步后台拉起并等就绪。
name: check
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - name: 构建
        run: npm run build
      - name: 检查矩阵（registry + i18n2 + derived）
        run: npm run check
      - name: 机制验收
        run: npm run accept:writeback && npm run accept:burn && npm run accept:seo && npm run accept:drafts && npm run accept:content-diff && npm run accept:workbench
      - name: 8092 端到端
        run: |
          npm run edit > /tmp/edit8092.log 2>&1 &
          for i in $(seq 1 90); do curl -sf -o /dev/null http://localhost:8092/products/single-girder-eot-cranes/ && break; sleep 1; done
          curl -sf -o /dev/null http://localhost:8092/products/single-girder-eot-cranes/ || { echo "=== 8092 未就绪，edit-server 日志 ==="; cat /tmp/edit8092.log; exit 1; }
          npm run accept:poc5 || { echo "=== poc5 首跑失败，重试一次（防慢机时序抖动；2026-08-29 前的 CI 红已定位为 Meta/Control 平台 bug，非 flake） ==="; npm run accept:poc5; }
      - name: 几何快照回归
        run: npm run geom
