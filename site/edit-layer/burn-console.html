<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>AI 烧制台 · DeepSeek</title>
<style>
body{font:14px/1.6 -apple-system,"PingFang SC",sans-serif;max-width:1080px;margin:24px auto;padding:0 16px;color:#1f2430}
h1{font-size:20px}.row{margin-bottom:12px}label{display:block;font-size:12px;color:#666;margin-bottom:4px}
input[type=text],textarea{width:100%;box-sizing:border-box;padding:8px;border:1px solid #ddd;border-radius:8px;font:inherit}
textarea{min-height:180px;font-family:ui-monospace,monospace;font-size:13px}
button{border:0;border-radius:8px;padding:9px 20px;background:#2563eb;color:#fff;cursor:pointer;font-size:14px}
button.ghost{background:#e5e7eb;color:#333}button:disabled{opacity:.5;cursor:wait}
#status{margin:12px 0;font-size:13px;color:#555}
.rep{background:#f6f7f9;border-radius:10px;padding:12px 16px;font-size:13px;margin:12px 0}
.rep .ok2{color:#16a34a}.rep .rep2{color:#d97706}.rep .abs2{color:#6b7280}.rep .fail2{color:#dc2626;font-weight:600}
iframe{width:100%;height:520px;border:1px solid #e5e7eb;border-radius:10px;background:#fff}
details{margin:12px 0}pre{white-space:pre-wrap;word-break:break-all;font-size:12px;max-height:360px;overflow:auto;background:#0f172a;color:#e2e8f0;padding:12px;border-radius:8px}
.actions{display:flex;gap:10px;margin:14px 0}
</style>
</head>
<body>
<h1>🔥 AI 烧制台 <small style="font-weight:400;color:#888">产品/文章 · DeepSeek · 落 draft 人工转正</small></h1>
<div class="row"><label>裸文章（与 URL 二选一，都填则以裸文章为准）</label><textarea id="text" placeholder="把原料文章粘贴到这里…"></textarea></div>
<div class="row"><label>或旧站页面 URL</label><input type="text" id="url" placeholder="https://www.dgcrane.com/zh/…"></div>
<div class="row"><label>模版/页族</label>
<select id="family" style="width:100%;box-sizing:border-box;padding:8px;border:1px solid #ddd;border-radius:8px;font:inherit;background:#fff">
  <!-- 选项清单暂为静态（edit-server 在并行改动中，接 scanKits 动态渲染待其落地——spec 已记触发条件）。
       value 规范：auto / 族短名(product|post) / 「族目录:套件名」（指定具体模版，一 astro 一模版） -->
  <option value="auto" selected>自动判断（AI 选族 → 通用版式；判不了会明说）</option>
  <optgroup label="产品页族">
    <option value="product">通用产品页（ProductPage·17 段超集）</option>
  </optgroup>
  <optgroup label="文章页族">
    <option value="post">通用文章页（PostPage·顺序章节）</option>
  </optgroup>
</select></div>
<div class="row"><label style="display:flex;align-items:center;gap:8px;font-weight:400;cursor:pointer"><input type="checkbox" id="organized" style="width:auto;margin:0"> 我已整理好内容（AI 只许整段搬运、一字不切；剩下的段落强制安置，保证零丢弃）</label></div>
<div class="row" style="display:flex;gap:12px">
  <div style="flex:1"><label>slug（英文裸名，如 5t-eot-crane）</label><input type="text" id="slug"></div>
  <div style="flex:1"><label>名称（中文：产品名或文章题）</label><input type="text" id="name"></div>
</div>
<button id="go">开始烧制</button>
<div id="status"></div>
<div id="out" hidden>
  <div class="rep" id="report"></div>
  <h3>结构预览（近似；真实页面存草稿后看）</h3>
  <iframe id="pv" sandbox></iframe>
  <details><summary>格式化 JSON 原文</summary><pre id="json"></pre></details>
  <div style="font-size:12px;color:#888;margin:8px 0">常驻提醒：烧制不产 hero 横幅图（图池全进 gallery），请存草稿后在编辑器补传；面包屑二级分类克隆自模版示例，请在编辑器确认。</div>
  <div class="actions">
    <button id="save">存草稿（落 content/products/，可进编辑器精修）</button>
    <button class="ghost" id="redo">重新烧</button>
    <button class="ghost" id="drop">丢弃</button>
  </div>
  <div id="saved"></div>
</div>
<script>
const $ = id => document.getElementById(id)
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
let current = null
$('go').onclick = async () => {
  const payload = { family: $('family').value, mode: $('organized').checked ? 'organized' : 'raw', text: $('text').value.trim() || undefined, url: $('url').value.trim() || undefined, slug: $('slug').value.trim(), productName: $('name').value.trim() }
  if ((!payload.text && !payload.url) || !payload.slug || !payload.productName) { $('status').textContent = '请填：裸文章或 URL 二选一 + slug + 名称'; return }
  $('go').disabled = true; $('out').hidden = true
  $('status').textContent = '🔥 烧制中（一次调用 DeepSeek 出整页 + 代码逐字验收，约 1-3 分钟）…'
  try {
    const r = await fetch('/__burn', { method: 'POST', body: JSON.stringify(payload) })
    const d = await r.json()
    if (!r.ok) throw new Error(d.error || r.status)
    current = { slug: payload.slug, json: d.json }
    const sec = d.report.sections.map(s => `<div class="${s.status === 'ok' ? 'ok2' : s.status === 'repaired' ? 'rep2' : s.status === 'absent' ? 'abs2' : 'fail2'}">${esc(s.key)}：${esc(s.status)}（${esc(s.attempts)} 次）${s.issues.length ? ' — ' + esc(s.issues.join('；')) : ''}</div>`).join('')
    const unusedRows = (d.report.unused ?? []).map(u => `第${u.n}段：${esc(u.preview)}…`).join('<br>')
    const fieldMapLine = d.report.fieldMap?.length ? `<div>格子对应原文：${d.report.fieldMap.map(f => `${esc(f.key)}←第${f.paras.join(',')}段`).join('；')}</div>` : ''
    $('report').innerHTML = `<b>校验报告</b>${fieldMapLine}${sec}
      <div>${unusedRows ? `⚠ 原文这些段落没被用上（人工判断要不要紧）：<br>${unusedRows}` : '无——原文全部用上'}</div>
      <div>图池：${esc(d.report.images.join(', ')) || '空'}</div>
      ${d.report.notes.map(n => `<div>⚠ ${esc(n)}</div>`).join('')}`
    $('pv').src = d.previewUrl
    $('json').textContent = JSON.stringify(d.json, null, 2)
    $('out').hidden = false; $('status').textContent = '✅ 烧完，请过目后决定'
  } catch (e) { $('status').textContent = '❌ ' + e.message }
  $('go').disabled = false
}
$('save').onclick = async () => {
  if (!current) return
  $('save').disabled = true
  try {
    const r = await fetch('/__burn-save', { method: 'POST', body: JSON.stringify(current) })
    const d = await r.json()
    if (!r.ok) { $('saved').textContent = '❌ ' + (d.error || r.status); return }
    // 链接按烧制结果的 page.type 自拼（edit-server 的 editUrl 写死 /products/，对文章草稿指错族——移交缺陷，客户端先兜住）
    const famDir = current.json?.page?.type === 'post' ? 'posts' : 'products'
    $('saved').innerHTML = `✅ 已落 draft：<b>${famDir}/${esc(d.slug)}.json</b>，已重建。<a href="/${famDir}/${esc(d.slug)}/" target="_blank">打开编辑器精修 →</a>`
  } catch (e) { $('saved').textContent = '❌ ' + e.message } finally { $('save').disabled = false }
}
$('redo').onclick = () => { $('out').hidden = true; $('status').textContent = '调整输入后再点「开始烧制」' }
$('drop').onclick = () => { current = null; $('out').hidden = true; $('status').textContent = '已丢弃，未落盘' }
</script>
<script>
// 族/模版下拉动态渲染：/__templates = scanKits 现算（一 astro 一模版，三件套齐全才可烧）
(async () => {
  try {
    const kits = await (await fetch('/__templates')).json();
    const sel = document.getElementById('family');
    let html = '<option value="auto" selected>自动判断（AI 选族 → 通用版式；判不了会明说）</option>';
    for (const [fam, label] of [['products', '产品页族'], ['posts', '文章页族']]) {
      const famKits = kits.filter(k => k.family === fam);
      html += `<optgroup label="${label}">`;
      html += `<option value="${fam}">通用${label}（套件自动选）</option>`;
      for (const k of famKits) {
        html += `<option value="${k.family}:${k.name}" ${k.complete ? '' : 'disabled'}>${k.name}${k.complete ? '' : '（缺三件套不可烧）'}</option>`;
      }
      html += '</optgroup>';
    }
    sel.innerHTML = html;
  } catch (e) { /* 保留静态通用选项 */ }
})();
</script>
</body>
</html>
